          description: A page of candles, or a stream of them.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
            Qelso-Attribution: {$ref: '#/components/headers/Qelso-Attribution'}
            Qelso-Data-Type: {$ref: '#/components/headers/Qelso-Data-Type'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandlesPage'}
            application/x-ndjson:
              schema: {type: string, description: One Candle object per line.}
            text/csv:
              schema: {type: string, description: 'Header row, then one Candle per row.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets/{market_id}/stats:
    get:
      tags: [History]
      operationId: getMarketStats
      summary: Market statistics
      description: |
        Volume, open interest, spread and depth for each interval, at 1m and coarser. `volume` covers the interval; the other fields are as of its end. Intervals with no change have `carried: true`.

        **`source`:**
        - `computed` (Kalshi): spread and depth from the order book and `volume` from trades, the same way on every venue; open interest and `volume_cum` as Kalshi reports them. Volume is in contracts.
        - `venue_reported` (Polymarket, for now): the venue's own figures.
          - `volume_cum` is the venue's running total in US dollars.
          - `volume` is given at 1d only, as the change in the day's highest value of that total.
          - `liquidity` and `spread` are the venue's; `open_interest` and depth are null.

        **Datasets read:** `stats_1m`, `bars_1m`.

        **Access:** `minute`. **Cost:** 1 unit per page.

        **Streams:** NDJSON or CSV. Resume key: `after=<t>`.

openapi: 3.1.0
info:
  title: Qelso Data API
  version: 2.0.0
  summary: Historical prediction-market data from Kalshi and Polymarket, from daily bars to individual order-book changes.
  description: |
    The Qelso Data API serves historical data from prediction-market venues through one set of endpoints:
    market discovery, minute and sub-minute prices, the order book at any millisecond, best bid/ask
    and book changes, and trades.

    ## Authentication
    - Send your API key in the `X-API-Key` header on every request (`GET /v2/health` needs none).
    - Existing API keys work here.
    - Your plan and add-ons decide which venues and data you can read. `GET /v2/usage` shows them.

    ## Venues and IDs
    - Every market, event and series has an ID made of the venue and the venue's own ID, separated by a colon. Examples:
      - market `kalshi:KXFEDDECISION-26OCT-H0` or `polymarket:560868`;
      - event `kalshi:KXFEDDECISION-26OCT`;
      - series `kalshi:KXFEDDECISION`.
    - For Polymarket, the part after the colon may also be the slug. Responses always return the numeric form.
    - Kalshi tickers are case-insensitive.
    - Responses also carry the venue's own IDs: `native_id` everywhere, and `native` in market details.
    - `GET /v2/venues` lists the venues, the datasets each one provides, and from when.
    - Combo (multivariate) markets are not covered.

    ## One market, one book: the YES side
    - Every market has two outcomes, YES and NO, and one order book: the **YES book**, bids and asks, best first.
      - On Kalshi, a NO bid at p is a YES ask at 1 − p.
      - Polymarket's two tokens mirror each other, so the YES token's book is the market's whole book. Never add the two together.
    - **`outcome=no`** returns the NO view on every price endpoint: prices become 1 − p, and bids and asks swap.
    - Many Polymarket markets have outcomes other than "Yes" and "No": two teams, "Over"/"Under", "Up"/"Down". On those, YES is the venue's first-listed outcome and NO the second. Every market object, and the `market` object of every history response, gives both labels in `outcomes`, e.g. `{"yes": {"label": "Browns"}, "no": {"label": "Steelers"}}`.
    - Scalar markets (`market_type: scalar`) settle at any value from 0 to 1 (`settlement_value`).

    ## Time
    - **Inputs** take three forms:
      - RFC 3339 (`2026-10-18T14:00:00Z`). Offsets are allowed; no offset means UTC.
      - A date (`2026-10-18`), meaning midnight UTC.
      - Epoch **milliseconds**.

      Digits beyond milliseconds are dropped.
    - **Windows** are `[start, end)`: `start` is included, `end` is not. An `end` later than now is treated as now.
    - **Outputs** are RFC 3339 UTC with milliseconds (`2026-10-18T14:00:00.000Z`).
    - **Grid rows** (prices, candles, stats, sampled books) each cover one interval `[t, t + resolution)` on the UTC grid:
      - 1m on the minute; 1h on the hour; 6h at 00, 06, 12 and 18; 1d at midnight;
      - 1s and 100ms on whole seconds and tenths.

      `t` is the interval's start. Prices, books and the state fields of stats are as of the interval's **end** (its close), so every grid endpoint lines up on `t`. Only whole intervals inside the window are returned.

      A row has `carried: true` when nothing changed in its interval, so its values repeat the previous row's. Where there is no data at an interval's end, its values are null.
    - **Event rows** (best bid/ask changes, book changes, trades) carry:
      - `ts`: the venue's time, in milliseconds;
      - `seq`: orders a market's rows that share the same `ts`, from 1. `(ts, seq)` is a row's position in the market; don't compare it across markets.

    ## Prices and sizes
    - Prices are numbers from 0 to 1 (dollars per $1 contract, the implied probability), with up to 6 decimals, on every venue.
    - Sizes are in contracts (Kalshi) or shares (Polymarket), with up to 6 decimals.
    - `mid` = (bid + ask) / 2. An empty bid counts as 0 and an empty ask as 1. It is null when both sides are empty.

    ## Pagination
    - Lists and history pages return `next_cursor`. Pass it back as `cursor`, with the same parameters, until it is null.
    - Cursors are opaque, tied to the request that produced them, and valid for 24 hours.
    - On history endpoints, a paging run serves the data available when its first page was served, so its pages never skip or repeat a row, unless the data is corrected while you page. Data that arrives later appears when you request again.

    ## Streams
    - History endpoints also stream. Send one of:
      - `Accept: application/x-ndjson`: one JSON row per line, the same objects as in `data`;
      - `Accept: text/csv`: a header row first.

      Books stream as NDJSON only. Discovery and lifecycle don't stream.
    - Streams carry rows only. For Kalshi data, the attribution and data type come in the `Qelso-Attribution` and `Qelso-Data-Type` response headers.
    - A stream that ends normally has delivered every row we hold for the window.
    - If anything fails after the first byte, we close the connection without finishing the response, so your HTTP client raises an error. Resume with `after=` set to the last row's key (each endpoint gives the fields).
    - Send `Accept-Encoding: gzip` for large streams.

    ## Limits
    Rate limits are counted in **units per minute per organisation**. Each response's `Qelso-Units` header gives its cost; `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` give your budget.

    | Class | Endpoints | Page size | Window per request | Units |
    |---|---|---|---|---|
    | Reference | venues, categories, series, events, markets, market, lifecycle, usage | ≤ 1,000 items (default 100) | — | 1 |
    | Minute | prices, candles and stats at 1m–1d; books at intervals of 1m–1d | ≤ 1,000 points | no limit (your plan's history window applies) | 1 |
    | Sub-minute | prices and candles at 1s and 100ms; books `at` a millisecond or at intervals below 1m | ≤ 10,000 points (books ≤ 1,000) | ≤ 6 h; books also ≤ 100,000 intervals | 5 |
    | Ticks | bbo, book-updates | ≤ 10,000 rows | ≤ 6 h | 10 |
    | Ticks | trades | ≤ 10,000 rows | ≤ 31 days | 10 |
    | Streams | prices, candles, stats, books, bbo, book-updates, trades with `Accept: application/x-ndjson` or `text/csv` | — | ≤ 24 h (sub-minute, bbo, book-updates; books below 1m also ≤ 100,000 intervals); ≤ 31 days (trades); ≤ 366 days (1m–1d) | the endpoint's page cost |

    - Book pages also stop at 100,000 price levels.
    - Requests rejected with 400, 403, 404 or 406 cost 1 unit. `GET /v2/health` is free.
    - Each organisation may run at most **2 streams** and **4 sub-minute or tick requests** at once.
    - Tick rows (pages and streams) count against monthly quotas, shown by `GET /v2/usage`.
    - A stream won't start when its quota is used up. Once started, a stream is never cut off for rate or quota, so it may finish slightly over.

    ## Errors
    Errors share one shape: `{"error": {"code": "...", "message": "...", "request_id": "...", "details": {...}}}`. The `code` values are stable:

    | HTTP | `code` | Meaning |
    |---|---|---|
    | 400 | `invalid_parameter` | A parameter is missing, malformed or out of range (`details.parameter`) |
    | 400 | `invalid_cursor` | The cursor is malformed or expired, or was sent with different parameters |
    | 400 | `window_too_large` | The window or number of intervals is over this endpoint's limit (`details.max`) |
    | 401 | `unauthorized` | The key is missing, invalid, revoked or expired |
    | 403 | `forbidden_venue` | No access to this venue (`details.reason`: `not_in_plan`, `eligibility_required` or `not_yet_available`) |
    | 403 | `forbidden_dataset` | This data isn't available to you on this venue (`details.reason`: `not_in_plan`, or `not_offered` when we don't offer it on that venue) |
    | 403 | `plan_history_limit` | `start` is earlier than your plan allows (`details.earliest_allowed`) |
    | 403 | `plan_resolution_not_allowed` | The resolution or interval is finer than your plan allows (`details.min_resolution`) |
    | 403 | `suspended` | Your organisation's access to this venue is suspended |
    | 404 | `not_found` | Unknown market, event, series or path |
    | 406 | `not_acceptable` | This endpoint can't return the format asked for in `Accept` |
    | 429 | `rate_limited` | Over your units per minute or your concurrent requests; wait `Retry-After` seconds |
    | 429 | `quota_exceeded` | A monthly quota is used up (`details.resets_at`); don't retry automatically |
    | 500 | `internal_error` | Our fault; retry with backoff and quote `request_id` |
    | 503 | `metadata_refreshing` | Market metadata is being refreshed; retry after `Retry-After` seconds |
    | 503 | `service_unavailable` | Temporarily unavailable; retry after `Retry-After` seconds |
    | 504 | `timeout` | The query ran over its time limit; narrow the window, or use a stream |

    ## Kalshi data
    - Every response and stream that contains Kalshi data carries `"attribution": "Powered by Kalshi Research"` and a `data_type`:
      - `historical`: all of the data is at least 24 hours old;
      - `delayed`: some of it is newer.
    - Show the attribution wherever you display Kalshi data.
    - Kalshi data is available to eligible organisations whose plan includes it.

    ## Coming from v1
    - IDs carry the venue: `polymarket:560868` or `polymarket:<slug>`.
    - Tokens are gone. There is one YES book per market; use `outcome=no` for the NO side.
    - Prices at 10m, 1h, 6h and 1d are interval closes, not averages. Sampled books are as of each interval's end, not its start, so they line up with prices.
    - Errors have stable codes. Limits are counted in units, not requests.

    ## Versioning
    - v2 changes only by addition: new endpoints, parameters, fields and enum values (venues, datasets, entitlements, lifecycle types, error codes) may appear. Treat unknown values as "other".
    - Anything that would break a client goes into a new version, with notice.
servers:
  - url: https://api.qelso.io
    description: Production
security:
  - ApiKeyAuth: []
tags:
  - name: Reference
    description: Venues, categories and what's available.
  - name: Discovery
    description: Series, events and markets on every venue.
  - name: History
    description: Prices, candles, statistics and order books, from daily to 100-millisecond intervals.
  - name: Ticks
    description: Best bid/ask changes, order-book changes and trades.
  - name: Account
    description: Usage, limits and health.

paths:
  /v2/health:
    get:
      tags: [Account]
      operationId: getHealth
      summary: Health
      description: |
        Whether the API can serve requests. Needs no key and costs nothing. Returns 503 when it can't.
      security: []
      responses:
        '200':
          description: Serving.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example: {status: ok, version: 2.0.0, time: '2026-10-18T14:00:00.000Z'}
        '503':
          description: Not serving.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
              example: {status: unavailable, version: 2.0.0, time: '2026-10-18T14:00:00.000Z'}

  /v2/usage:
    get:
      tags: [Account]
      operationId: getUsage
      summary: Usage, entitlements and quotas
      description: |
        Your organisation's plan, rate limit, access per venue and dataset, and monthly quotas with what's used so far.

        **Access:** any key. **Cost:** 1 unit.
      responses:
        '200':
          description: Usage.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/venues:
    get:
      tags: [Reference]
      operationId: listVenues
      summary: Venues and their datasets
      description: |
        Every venue, the datasets it provides, from when each one is available, and the attribution its data must carry.

        **Access:** any key. **Cost:** 1 unit.
      responses:
        '200':
          description: Venues.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/categories:
    get:
      tags: [Reference]
      operationId: listCategories
      summary: Categories
      description: |
        Our category taxonomy, used by the `category` filter on every venue, and the venue categories each one includes.

        **Access:** any key. **Cost:** 1 unit.
      responses:
        '200':
          description: Categories.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/series:
    get:
      tags: [Discovery]
      operationId: listSeries
      summary: List series
      description: |
        Series (recurring groups of events, such as a monthly Fed decision) on the venues you can access.

        Without `venue`, the list covers every venue your key can read.

        **Access:** `reference` for each venue listed. **Cost:** 1 unit per page.
      parameters:
        - $ref: '#/components/parameters/VenueFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: sort
          in: query
          description: Sort field. With `search`, results are sorted by relevance instead.
          schema: {type: string, enum: [updated_at, created_at], default: updated_at}
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/DiscoveryLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of series.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/events:
    get:
      tags: [Discovery]
      operationId: listEvents
      summary: List events
      description: |
        Events (one question with one or more markets, such as a Fed decision with one market per outcome) on the venues you can access.

        - `status` matches an event if **any** of its markets has that status.
        - The time filters use the event's `start_time` (its earliest market open) and `end_time` (its latest market close).

        **Access:** `reference` for each venue listed. **Cost:** 1 unit per page.
      parameters:
        - $ref: '#/components/parameters/VenueFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SeriesFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Ids'
        - {$ref: '#/components/parameters/OpenFrom', description: 'Events whose earliest market opens at or after this time.'}
        - {$ref: '#/components/parameters/OpenTo', description: 'Events whose earliest market opens before this time.'}
        - {$ref: '#/components/parameters/CloseFrom', description: 'Events whose latest market closes at or after this time.'}
        - {$ref: '#/components/parameters/CloseTo', description: 'Events whose latest market closes before this time.'}
        - $ref: '#/components/parameters/UpdatedSince'
        - name: sort
          in: query
          description: Sort field. With `search`, results are sorted by relevance instead.
          schema: {type: string, enum: [updated_at, created_at, start_time, end_time], default: updated_at}
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/DiscoveryLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of events.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets:
    get:
      tags: [Discovery]
      operationId: listMarkets
      summary: List markets
      description: |
        Markets on the venues you can access.

        - To sync a local copy, use `updated_since` with `sort=updated_at&order=asc`.
        - To look up known markets, use `ids` (up to 100).

        **Access:** `reference` for each venue listed. **Cost:** 1 unit per page.
      parameters:
        - $ref: '#/components/parameters/VenueFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SeriesFilter'
        - $ref: '#/components/parameters/EventFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Ids'
        - $ref: '#/components/parameters/OpenFrom'
        - $ref: '#/components/parameters/OpenTo'
        - $ref: '#/components/parameters/CloseFrom'
        - $ref: '#/components/parameters/CloseTo'
        - $ref: '#/components/parameters/UpdatedSince'
        - name: sort
          in: query
          description: Sort field. With `search`, results are sorted by relevance instead.
          schema: {type: string, enum: [updated_at, created_at, open_time, close_time], default: updated_at}
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/DiscoveryLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of markets.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets/{market_id}:
    get:
      tags: [Discovery]
      operationId: getMarket
      summary: Market details
      description: |
        Everything we hold about one market: rules, outcome labels, tick structure, times, settlement, the venue's own IDs and venue-specific fields.

        With `as_of`, you get the metadata as it was at that time (Kalshi only for now; on Polymarket it returns `invalid_parameter`):
        - Metadata history is available from 17 October 2026.
        - If `as_of` is before the market's first available version (always the case before 17 October 2026), you get that first version, so the details at `as_of` may have been different.

        **Access:** `reference` for the venue. **Cost:** 1 unit.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: as_of
          in: query
          description: 'Kalshi only: return the metadata as it was at this time (available from 17 October 2026).'
          schema: {$ref: '#/components/schemas/TimestampInput'}
      responses:
        '200':
          description: The market.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /v2/markets/{market_id}/lifecycle:
    get:
      tags: [Discovery]
      operationId: listMarketLifecycle
      summary: Market lifecycle
      description: |
        Status changes, close-time changes, results, and edits to the rules and other metadata, in time order.

        - **Kalshi:** changes from 17 October 2026. Before that, only the market's creation and final result are known.
        - **Polymarket:** creation, close and result only.

        Without `start` and `end`, you get the market's whole life.

        **Access:** `reference` for the venue. **Cost:** 1 unit per page.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - {$ref: '#/components/parameters/StartOptional'}
        - {$ref: '#/components/parameters/EndOptional'}
        - $ref: '#/components/parameters/DiscoveryLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of lifecycle changes.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LifecyclePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets/{market_id}/prices:
    get:
      tags: [History]
      operationId: getMarketPrices
      summary: Prices
      description: |
        Bid, ask, mid and last trade for each interval, as the interval's close:
        - `bid`, `ask` and `mid`: the state at the end of the interval;
        - `last`: the last trade before the end;
        - intervals with no change repeat the previous values, with `carried: true`;
        - intervals with no data at their end have null values.

        **Availability:**
        - **Kalshi:** 1m and coarser from `bars_1m`'s `available_from` in `GET /v2/venues` (it moves earlier as history is loaded); 1s and 100ms from 17 October 2026.
        - **Polymarket:**
          - 1m and coarser from `bars_1m`'s `available_from` in `GET /v2/venues`, with `mid` only: `bid` and `ask` are null.
          - `last` from `trades`' `available_from` in `GET /v2/venues`: the price of the last trade before the interval's end. A page with `last` ends where both the mid and the trades are available, which can be earlier than the mid alone: leave `last` out of `fields` for the latest mids. Without `last`, `carried` doesn't look at trades: an interval with a trade and no other change is `carried: true`.
          - Markets that closed before `bars_1m`'s `available_from` have no mid; their `last` runs from `trades`' `available_from`, so those that closed before that have neither.
          - 1s and 100ms from `bbo`'s `available_from` in `GET /v2/venues`, with `bid`, `ask` and `mid` from the book. A page there can hold fewer than `limit` points before the window's end, on markets whose book changes very often: keep paging until `next_cursor` is null.

        **Datasets read:** `bars_1m` (1m and coarser); `bbo` and `trades` (1s, 100ms). On Polymarket, `trades` is read only for `last`, at every resolution.

        **Access:** `minute`, or `subminute` for 1s and 100ms. **Cost:** 1 unit per page, or 5 at 1s and 100ms.

        **Streams:** NDJSON or CSV. Resume key: `after=<t>`.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/Resolution'
        - name: fields
          in: query
          description: Comma-separated fields to return. Fields not asked for are left out of each row.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string, enum: [bid, ask, mid, last]}
            minItems: 1
            uniqueItems: true
            default: [bid, ask, mid, last]
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AfterT'
      responses:
        '200':
          description: A page of price points, or a stream of them.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
            Qelso-Attribution: {$ref: '#/components/headers/Qelso-Attribution'}
            Qelso-Data-Type: {$ref: '#/components/headers/Qelso-Data-Type'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PricesPage'}
            application/x-ndjson:
              schema: {type: string, description: One PricePoint object per line.}
            text/csv:
              schema: {type: string, description: 'Header row, then one PricePoint per row: t, the fields asked for, carried.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets/{market_id}/candles:
    get:
      tags: [History]
      operationId: getMarketCandles
      summary: Candles
      description: |
        Open, high, low and close for each interval, with volume, trade count and VWAP.

        **`basis`:**
        - `mid` (default): the OHLC is of the mid price;
        - `trade`: the OHLC is of trade prices.

        Volume, trades and VWAP always come from trades, and are null where the venue's trades aren't available.

        **Empty intervals:** they repeat the previous close with zero volume and `carried: true`. Intervals with no data at their end are null.

        **Availability:** as for prices.
        - **Kalshi:** trade candles from `trades`' `available_from` in `GET /v2/venues`; before 16:16 UTC on 17 October 2026, mid `high` and `low` may be null. Before 18 October 2026, a trade candle's `open` and `close` follow the order of trades that share a `ts`, so they can differ from the first and last trade executed.
        - **Polymarket:** trade candles, volume, trades and VWAP from `trades`' `available_from` in `GET /v2/venues`. Each trade is the fill of one maker order (see `trades`): a taker order that fills three resting orders counts as three trades, and volume counts each share once. Mid candles end where both the mid and the trades are available; trade candles where the trades are. Markets that closed before `bars_1m`'s `available_from` have mid candles with a null open, high, low and close; their trade candles, volume, trades and VWAP run from `trades`' `available_from`. At 1s and 100ms a page can hold fewer than `limit` candles before the window's end, as for prices.

        **Datasets read:** `bars_1m`, `trades`; `bbo` at 1s and 100ms.

        **Access:** `minute`, or `subminute` for 1s and 100ms. **Cost:** 1 unit per page, or 5 at 1s and 100ms.

        **Streams:** NDJSON or CSV. Resume key: `after=<t>`.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/Resolution'
        - name: basis
          in: query
          description: Price the OHLC is built from.
          schema: {type: string, enum: [mid, trade], default: mid}
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AfterT'
      responses:

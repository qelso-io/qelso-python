  /v2/markets/{market_id}/books:
    get:
      tags: [History]
      operationId: getMarketBooks
      summary: Order books
      description: |
        The order book at one millisecond, or sampled on a time grid. Give either `at`, or `start` and `end` (with `interval`), not both.

        - **`at`:** the book with every change at or before `at` applied. `data` holds one book, with `t` = `at`.
        - **`start`, `end`, `interval`:** one book per interval `[t, t + interval)` in the window, as of the interval's end, like prices. Intervals with no data at their end have null `bids` and `asks`.
        - **`last_change`:** the time of the latest change included in each book.

        **Availability:**
        - **Kalshi:** from 17 October 2026, exact to the millisecond.
        - **Polymarket:**
          - At intervals of 1m and coarser, from `book_snapshots`' `available_from` in `GET /v2/venues`: each book is the latest minute book at or before the interval's end. `last_change` is that book's time; the change itself may be earlier.
          - At a millisecond, or below 1m: from `book_updates`' `available_from` in `GET /v2/venues`. `last_change` there can be earlier or later than the book's latest real change: for exact times, use `book-updates`.

        **Datasets read:** `book_snapshots`, `book_updates`.

        **Access:** `minute` for intervals of 1m and coarser; `subminute` for `at` and for intervals below 1m. **Cost:** 1 unit per page; 5 for `at` and below 1m.

        **Limits:** a page holds up to `limit` books and stops at 100,000 price levels. Below 1m, the window is ≤ 6 h and ≤ 100,000 intervals. On Polymarket below 1m, a page can also stop sooner, on markets whose book changes very often.

        **Streams:** NDJSON only. Resume key: `after=<t>`.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - name: at
          in: query
          description: One book at this instant. Not with `start`, `end` or `interval`.
          schema: {$ref: '#/components/schemas/TimestampInput'}
        - {$ref: '#/components/parameters/StartOptional', description: 'Start of the grid (with `end`). Not with `at`.'}
        - {$ref: '#/components/parameters/EndOptional', description: 'End of the grid, exclusive (with `start`). Not with `at`.'}
        - name: interval
          in: query
          description: Interval length, with `start` and `end` (1m if omitted). Not with `at`.
          schema: {type: string, enum: ['100ms', '1s', '1m', '10m', '1h', '6h', '1d']}
        - name: depth
          in: query
          description: Price levels per side, best first, or `all`.
          schema:
            anyOf:
              - {type: integer, minimum: 1, maximum: 1000}
              - {type: string, enum: [all]}
            default: 10
        - $ref: '#/components/parameters/Outcome'
        - name: limit
          in: query
          description: Books per page.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AfterT'
      responses:
        '200':
          description: A page of books, or an NDJSON stream of them.
          headers:
            X-Request-ID: {$ref: '#/components/headers/X-Request-ID'}
            X-RateLimit-Limit: {$ref: '#/components/headers/X-RateLimit-Limit'}
            X-RateLimit-Remaining: {$ref: '#/components/headers/X-RateLimit-Remaining'}
            X-RateLimit-Reset: {$ref: '#/components/headers/X-RateLimit-Reset'}
            Qelso-Units: {$ref: '#/components/headers/Qelso-Units'}
            Qelso-Attribution: {$ref: '#/components/headers/Qelso-Attribution'}
            Qelso-Data-Type: {$ref: '#/components/headers/Qelso-Data-Type'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BooksPage'}
              examples:
                book_at_a_millisecond:
                  summary: The book at one millisecond (illustrative values, top of book)
                  value:
                    market:
                      id: kalshi:KXFEDDECISION-26DEC-H0
                      venue: kalshi
                      native_id: KXFEDDECISION-26DEC-H0
                      title: Fed holds rates in December 2026?
                      status: open
                      outcomes: {'yes': {label: Hold, token_id: null}, 'no': {label: 'No', token_id: null}}
                      open_time: '2026-09-17T18:00:00.000Z'
                      close_time: '2026-12-09T18:55:00.000Z'
                    outcome: 'yes'
                    interval: null
                    depth: 1
                    data:
                      - t: '2026-11-03T14:03:07.250Z'
                        bids: [[0.47, 600]]
                        asks: [[0.49, 800]]
                        last_change: '2026-11-03T14:03:06.981Z'
                    next_cursor: null
                    attribution: Powered by Kalshi Research
                    data_type: historical
            application/x-ndjson:
              schema: {type: string, description: One BookSample object per line.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/Timeout'}

  /v2/markets/{market_id}/bbo:

        - **Polymarket:** from `bbo`'s `available_from` in `GET /v2/venues`.

        **Datasets read:** `bbo`.

        **Access:** `ticks`. **Cost:** 10 units per page; rows count against your ticks quota. **Window:** ≤ 6 h (streams ≤ 24 h).

        **Streams:** NDJSON or CSV. Resume key: `after=<ts>,<seq>`.
      parameters:
        - $ref: '#/components/parameters/MarketId'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/TickLimit'
        - $ref: '#/components/parameters/Cursor'

[project]
name = "qelso"
dynamic = ["version"]
description = "Python client for the Qelso Data API: historical prediction-market data from Kalshi and Polymarket."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Qelso" }]
requires-python = ">=3.10"
# A library: wide ranges, so it installs beside whatever else a customer runs. uv.lock pins what CI tests.
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]
keywords = ["qelso", "kalshi", "polymarket", "prediction markets", "market data", "order book"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]

[project.urls]
Homepage = "https://www.qelso.io"
Documentation = "https://docs.qelso.io"
Repository = "https://github.com/qelso-io/qelso-python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/qelso/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qelso"]

[tool.hatch.build.targets.sdist]
include = ["src/qelso", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "mypy>=1.15",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "ruff==0.17.1",  # pinned: one formatter version everywhere
]

[tool.uv]
# Only libraries published before this date (move it on purpose to upgrade).
exclude-newer = "2026-10-14T00:00:00Z"
exclude-newer-package = { ruff = false }  # dev only, pinned above

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["SIM105", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["qelso"]

[tool.ruff.lint.per-file-ignores]
# Generated from the contract: its descriptions keep their tables and long lines.
"src/qelso/models.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"src/qelso/_operations.py" = ["E501", "RUF001", "RUF002", "RUF003"]
"tests/*" = ["ASYNC109"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
plugins = ["pydantic.mypy"]
files = ["src/qelso", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

name: ci

# Checks on every push and pull request: lint, types, the generated code against the contract, the tests, the
# build. The code is generated from the Qelso API's contract (contract/), so a change starts there.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: the generated code follows the contract
        run: uv run python scripts/generate.py --check
      - run: uv run pytest -q
      - name: the package builds
        run: uv build
